name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:

jobs:
  # Docs-only changes (Markdown, LICENSE, issue and discussion templates,
  # images and pages under docs/) skip the jobs below. They are skipped with a
  # job-level `if`, not paths-ignore, so required checks still pass.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          # No usable base (manual run, new branch, rewritten history): build.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$base" HEAD)
          echo "Changed files:"
          echo "$changed"
          docs='^(.*\.md|LICENSE.*|\.github/(ISSUE_TEMPLATE|DISCUSSION_TEMPLATE)/.*|docs/.*\.(svg|png|jpe?g|gif|webp|ico|html|css))$'
          keep=''
          code_files=$( { echo "$changed" | grep -vE "$docs"; [ -n "$keep" ] && echo "$changed" | grep -E "$keep"; } | grep -c . || true)
          if [ "$code_files" -gt 0 ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docs-only change: skipping the build and test jobs."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  validate:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore .\OmnifinNative\OmnifinNative.csproj -r win-x64

      - name: Check formatting and analyzers
        run: dotnet format .\OmnifinNative\OmnifinNative.csproj --verify-no-changes --no-restore

      - name: Build project
        run: dotnet build .\OmnifinNative\OmnifinNative.csproj -c Release -r win-x64 --no-restore -warnaserror /p:PublishReadyToRun=false
